name: tepy_mobile
description: "Tepy Android / Windows 控制台：Mac 状态、MQTT 唤醒和键盘操作，含中文学习注释。"
publish_to: 'none'
version: 0.2.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  mqtt_client: 10.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  fake_async: 1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - third_party/usb-serial-LICENSE.txt
    - assets/fonts/OFL.txt
  fonts:
    - family: TepySans
      fonts:
        - asset: assets/fonts/TepySans.ttf

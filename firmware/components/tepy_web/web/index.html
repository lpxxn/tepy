<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tepy · 设备管理</title>
<style>
:root{color-scheme:light;--ink:#18302c;--accent:#136b53;--line:#d9e4df}*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:960px;margin:40px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:30px;margin:0;letter-spacing:-1px}h2{font-size:19px;margin:0 0 16px}p{margin:8px 0 16px}.muted{color:#61746d}section{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}label{display:block;font-size:13px;margin:12px 0}input,textarea{display:block;width:100%;border:1px solid #bccdc4;border-radius:7px;padding:10px;font:inherit;background:white;color:var(--ink);margin-top:5px}input[type=checkbox]{display:inline;width:auto;margin-right:6px}textarea{font:12px/1.4 monospace}button{border:0;border-radius:7px;padding:10px 15px;cursor:pointer;background:var(--accent);color:white;font:inherit;margin:8px 6px 0 0}button.secondary{background:#e6eeea;color:var(--ink)}button.danger{background:#a83b35}button:disabled{opacity:.5;cursor:wait}#notice{position:sticky;top:8px;z-index:1;background:#e5f1eb;border:1px solid #b7d8c7;padding:12px;border-radius:8px;white-space:pre-wrap}#notice.bad{background:#fff0e9;border-color:#efbeaa}#state{white-space:pre-wrap;word-break:break-word;font:13px/1.6 monospace}.hidden{display:none!important}.actions{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}small{color:#61746d}footer{padding:10px 0 30px;color:#61746d;font-size:13px}
</style></head><body><main>
<header><div><h1>Tepy</h1><span class="muted">MQTT → 蓝牙键盘</span></div><button id="logout" class="secondary hidden">退出管理</button></header>
<p id="notice" class="hidden" role="status"></p>
<section id="login"><h2>连接你的设备</h2><p class="muted">输入首次启动或手动恢复时串口显示的管理口令。</p><form id="loginForm"><label>管理口令<input id="token" type="password" required autocomplete="current-password"></label><button>进入管理</button></form></section>
<div id="dashboard" class="hidden">
<section><h2>运行状态</h2><div id="state">正在读取…</div><small>HID 发送完成不代表 Mac 已解锁。请先在文本编辑器测试。</small></section>
<section><h2>网络与输入配置</h2><form id="configForm"><div class="grid"><div>
<label>Wi-Fi 名称<input id="ssid" list="networks" maxlength="32"><datalist id="networks"></datalist></label><button type="button" id="scan" class="secondary">扫描 Wi-Fi</button>
<label>新 Wi-Fi 密码<input id="wifiPassword" type="password" autocomplete="new-password" placeholder="留空保留已有密码"></label><label><input id="clearWifi" type="checkbox">清除 Wi-Fi 密码（开放网络）</label>
<label>NTP 服务器<input id="ntp" required maxlength="128"></label><label>按下／释放间隔（毫秒）<input id="delay" type="number" min="5" max="200" required></label>
</div><div><label>MQTT 地址<input id="uri" placeholder="mqtt://192.168.1.10:1883" maxlength="256"></label><label>MQTT 用户名<input id="username" maxlength="128" autocomplete="off"></label>
<label>新 MQTT 密码<input id="mqttPassword" type="password" autocomplete="new-password" placeholder="留空保留已有密码"></label><label><input id="clearMqtt" type="checkbox">清除 MQTT 密码</label>
<label>CA 证书（PEM，可选）<textarea id="ca" rows="5" maxlength="8192" placeholder="留空使用内置证书包"></textarea></label>
</div></div><label>新管理口令（可选，16–64 位，不含空格）<input id="newAdmin" type="password" autocomplete="new-password" maxlength="64" pattern="[!-~]{16,64}" placeholder="留空保留当前口令"></label><small id="secretStatus"></small>
<div class="actions"><button>保存配置</button><button type="button" id="reboot" class="secondary">重启设备</button><button type="button" id="reload" class="secondary">重新读取</button></div></form></section>
<section><h2>蓝牙配对</h2><p class="muted">开启两分钟配对窗口后，在 Mac 的蓝牙设置连接 Tepy。将 Mac 显示的六位码填入下方。已有绑定需先清除才能更换 Mac。</p>
<button id="pair">开启配对窗口</button><button id="clearBond" class="danger">清除绑定</button>
<form id="passkeyForm"><label>Mac 显示的配对码<input id="passkey" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" placeholder="123456" required></label><button>提交配对码</button></form></section>
<section><h2>固件升级</h2><p class="muted">选择构建生成的 tepy.bin 应用镜像。请勿上传合并镜像；升级后设备会自动重启。</p><form id="otaForm"><input id="firmware" type="file" accept=".bin" required><button id="otaButton">上传并升级</button></form></section>
</div><footer>独立供电 · BLE HID · ESP-IDF 6.1 / C++23<br>配置保存后需重启生效。恢复热点：运行时长按 BOOT 三秒。</footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('tepyToken')||'';let polling=false,upgrading=false;
function notice(message,bad=false){$('notice').textContent=message;$('notice').className=bad?'bad':'';}
async function api(path,options={}){const headers={'Authorization':'Bearer '+token,...options.headers};const response=await fetch('/api/v1/'+path,{...options,headers,cache:'no-store'});const value=await response.json();if(!response.ok){if(response.status===401)logout();throw new Error(value.error||'请求失败');}return value;}
function logout(){token='';sessionStorage.removeItem('tepyToken');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden');}
function action(handler){return async event=>{event.preventDefault();try{await handler(event);}catch(error){notice(error.message,true);}};}
async function state(){const s=await api('status');$('state').textContent=[`设备：${s.device_id} · 固件 ${s.firmware}`,`Wi-Fi：${s.wifi.connected?'已连接':'未连接'} ${s.wifi.ip||''}  热点：${s.wifi.hotspot?'开启':'关闭'}`,`MQTT：${s.mqtt.connected?'已连接':'未连接'}  校时：${s.time_ready?'完成':'等待 NTP'}`,`蓝牙：${s.ble.connected?'已连接':'未连接'} / ${s.ble.ready?'可以发送':'尚未就绪'} / ${s.ble.bonded?'已有绑定':'未绑定'}`,`配对窗口：${s.ble.pairing_open?'开启':'关闭'}  配对码：${s.ble.passkey_pending?'等待输入':'无待处理请求'}`,`执行器：${s.busy?'忙碌':'空闲'}`].join('\n');}
async function config(){const c=await api('config');$('ssid').value=c.wifi.ssid;$('uri').value=c.mqtt.uri;$('username').value=c.mqtt.username;$('ca').value=c.mqtt.ca;$('ntp').value=c.ntp_server;$('delay').value=c.key_delay_ms;$('secretStatus').textContent=`已有 Wi-Fi 密码：${c.wifi.password_set?'是':'否'}；已有 MQTT 密码：${c.mqtt.password_set?'是':'否'}`;for(const id of ['wifiPassword','mqttPassword','newAdmin'])$(id).value='';$('clearWifi').checked=false;$('clearMqtt').checked=false;}
async function enter(){await state();await config();sessionStorage.setItem('tepyToken',token);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');notice('已连接。');if(!polling){polling=true;setInterval(()=>{if(token&&!upgrading)state().catch(error=>notice(error.message,true));},3000);}}
$('loginForm').onsubmit=action(async()=>{token=$('token').value;await enter();$('token').value='';});$('logout').onclick=logout;
$('configForm').onsubmit=action(async()=>{const c={v:1,wifi:{ssid:$('ssid').value},mqtt:{uri:$('uri').value,username:$('username').value,ca:$('ca').value},ntp_server:$('ntp').value,key_delay_ms:Number($('delay').value)};if($('wifiPassword').value||$('clearWifi').checked)c.wifi.password=$('clearWifi').checked?'':$('wifiPassword').value;if($('mqttPassword').value||$('clearMqtt').checked)c.mqtt.password=$('clearMqtt').checked?'':$('mqttPassword').value;if($('newAdmin').value)c.admin_password=$('newAdmin').value;await api('config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});if(c.admin_password){token=c.admin_password;sessionStorage.setItem('tepyToken',token);}await config();notice('已保存，请点击“重启设备”使网络和输入配置生效。');});
$('reload').onclick=action(config);$('reboot').onclick=action(async()=>{if(confirm('重启设备？')){await api('reboot',{method:'POST'});notice('设备正在重启，请稍后重新连接。');}});
$('pair').onclick=action(async()=>{await api('ble/pair',{method:'POST'});notice('配对窗口已请求开启，请在 Mac 上连接。');});
$('clearBond').onclick=action(async()=>{if(confirm('清除蓝牙绑定并断开当前 Mac？')){await api('ble/clear',{method:'POST'});notice('已请求清除绑定，请同时在 Mac 上忽略旧设备。');}});
$('passkeyForm').onsubmit=action(async()=>{await api('ble/passkey',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passkey:$('passkey').value})});$('passkey').value='';notice('配对码已提交，请观察连接状态。');});
$('scan').onclick=action(async()=>{const button=$('scan');button.disabled=true;try{let result=await api('wifi/scan');for(let i=0;result.scanning&&i<10;i++){await new Promise(resolve=>setTimeout(resolve,1000));result=await api('wifi/scan');}const list=$('networks');list.replaceChildren();for(const n of result.networks||[]){const option=document.createElement('option');option.value=n.ssid;option.label=n.rssi+' dBm';list.appendChild(option);}notice(result.scanning?'扫描尚未完成，请稍后重试。':'扫描完成，请在 Wi-Fi 名称中选择。');}finally{button.disabled=false;}});
$('otaForm').onsubmit=action(async()=>{const file=$('firmware').files[0];if(!file||!confirm('上传固件并重启？'))return;const button=$('otaButton');button.disabled=true;upgrading=true;try{notice('正在上传固件，请保持设备供电…');await api('ota',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});notice('升级完成，设备正在重启。');}finally{button.disabled=false;upgrading=false;}});
if(token)enter().catch(error=>{logout();notice(error.message,true);});
</script></body></html>
